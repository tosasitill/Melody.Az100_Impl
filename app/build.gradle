plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tosasitill.az100'
    compileSdk 37

    defaultConfig {
        applicationId 'com.tosasitill.az100'
        minSdk 29
        targetSdk 35
        versionCode 46
        versionName '2.0.12'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.9.1'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    // Keep KavaRef member resolution separate from the runtime hook backend.
    implementation 'com.highcapable.kavaref:kavaref-core:1.0.3'
    implementation 'com.highcapable.kavaref:kavaref-extension:1.0.3'

    // Pure-Kotlin protocol/state logic is covered by JVM tests; see
    // app/src/test/java/com/tosasitill/az100/.  No Android or device needed.
    testImplementation 'junit:junit:4.13.2'
}
