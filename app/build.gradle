plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.tosasitill.az100'
    compileSdk 37

    defaultConfig {
        applicationId 'com.tosasitill.az100'
        minSdk 29
        targetSdk 35
        versionCode 33
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.9.1'
    compileOnly('de.robv.android.xposed:api:82') {
        transitive = false
    }
    implementation('com.highcapable.yukihookapi:api:1.3.2')
    ksp('com.highcapable.yukihookapi:ksp-xposed:1.3.2')

    // YukiHookAPI declares KavaRef at runtime scope only, so it must be asked for
    // explicitly to compile against it.  KavaRef is the reflection layer Yuki's
    // own API is migrating to -- YukiHookAPI 2.0.0 removes the built-in one.
    implementation 'com.highcapable.kavaref:kavaref-core:1.0.3'
    implementation 'com.highcapable.kavaref:kavaref-extension:1.0.3'
}
